name: Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android_build.yml'
      - 'android/**'

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Install Compiler
        uses: rlalik/setup-cpp-compiler@master
        with:
          compiler: latest

      # - name: Run Core Test
      #   working-directory: core
      #   run: (cc -o run/build run/build.c) && (run/build test)

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle CLI
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-disabled: true

      - name: Build Android
        working-directory: android
        run: ./gradlew build

#      - name: Upload Build Report
#        if: always()
#        uses: actions/upload-artifact@v7
#        with:
#          name: android-report
#          if-no-files-found: ignore # Don't error if the report doesn't exist
#          overwrite: true
#          path: android/build/reports/

      - name: Upload APK Artifact
        if: success() # Only upload APK if build succeeds
        uses: actions/upload-artifact@v7
        with:
          name: APK
          compression-level: 9
          if-no-files-found: error
          overwrite: true
          path: android/build/outputs/apk/**/*.apk


